<svg xmlns="http://www.w3.org/2000/svg"
     width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">dsh-ascoder logo</title>
  <desc id="logo-desc">项目原生 LOGO：圆角瓷片内为项目首字母 A，下方为项目名。</desc>
  <rect width="320" height="320" rx="64" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="2"/>
  <g stroke="#F0F2F5" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/><line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="0" y1="80" x2="320" y2="80"/><line x1="0" y1="160" x2="320" y2="160"/><line x1="0" y1="240" x2="320" y2="240"/>
  </g>
  <rect x="24" y="24" width="272" height="176" rx="32" fill="none" stroke="#4D6BFE" stroke-width="2" opacity="0.35"/>
  <text x="160" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="72" font-weight="700" fill="#4D6BFE" text-anchor="middle">A</text>
  <text x="160" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#414A55" text-anchor="middle">dsh-ascoder</text>
</svg>
